# 4 cores / ~8 GB RAM box (WSL2). Do not raise these; if a build OOMs, run
# `./gradlew --stop` before retrying.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache stays off until M1 lands: Room/KSP task graphs are the usual
# first place it bites, and there is no build-time pain to justify it yet.

kotlin.code.style=official
android.nonTransitiveRClass=true
